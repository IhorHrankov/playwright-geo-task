[project]
name = "agtech-fields-qa"
version = "1.0.0"
description = "QA artefacts and automated tests (Python + Playwright) for AgTech Fields GIS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pytest>=8.2",
    "pytest-playwright>=0.5",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=14.0",
    "pytest-html>=4.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
base_url = "https://main.d8gkeeaiko6qy.amplifyapp.com"
xfail_strict = true
addopts = [
    "-ra",
    "--strict-markers",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--video=retain-on-failure",
    "--output=test-results/artifacts",
]
markers = [
    "smoke: critical-path checks, run on every build",
    "regression: full functional regression",
    "ui: end-to-end browser tests",
    "api: HTTP-level checks without a browser",
    "unit: fast checks of framework helpers (no network)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Ukrainian strings contain Cyrillic look-alike letters

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
